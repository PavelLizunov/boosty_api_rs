[package]
name = "boosty_api"
version = "0.28.0"
edition = "2024"
description = "API client for interacting with Boosty platform"
license = "MIT"
repository = "https://github.com/ath31st/boosty_api_rs"
readme = "README.md"
keywords = ["api", "boosty", "client", "http", "async"]
categories = ["api-bindings", "web-programming"]
documentation = "https://docs.rs/boosty_api"

[dependencies]
# The library itself only needs tokio::sync::Mutex; the full runtime and
# macros are dev-only (tests, doc examples).
tokio = { version = "1.52", features = ["sync"] }
# rustls (not native-tls): portable, and required to embed this client in
# downstream workspaces that forbid openssl-sys / native-tls.
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "form", "rustls", "charset", "http2"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_path_to_error = "0.1.20"
rust_decimal = "1.42"
thiserror = "2.0.12"
serde_urlencoded = "0.7.1"

[dev-dependencies]
mockito = "1.7.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
